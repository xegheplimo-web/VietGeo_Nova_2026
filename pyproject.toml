[project]
name = "vietgeo-nova"
version = "1.0.0"
description = "VietGeo Nova — bản đồ Việt Nam local-first: HTTP server + SQLite (FTS5) + MapLibre"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
osm = ["osmium>=4.0"]

[dependency-groups]
dev = ["ruff>=0.5", "mypy>=1.10"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = "(backups|runtime|\\.venv)/"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "backups",
    "runtime",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                 # isort
    "UP",                # pyupgrade
    "B",                 # bugbear
    "SIM",               # simplify
    "RUF",               # ruff-native
]
ignore = [
    "TRY004",            # normalize() raises ValueError on bad input shape — intentional
]

[tool.ruff.lint.per-file-ignores]
"tools/import_osm.py" = ["E501"]
"vietgeo/osm.py" = ["E501"]
"vietgeo/server.py" = ["E501", "SIM105"]
"vietgeo/db.py" = ["E501", "TRY004"]

[tool.ruff.format]
quote-style = "double"
