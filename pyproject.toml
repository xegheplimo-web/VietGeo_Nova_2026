[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "backups",
    "runtime",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                 # isort
    "UP",                # pyupgrade
    "B",                 # bugbear
    "SIM",               # simplify
    "RUF",               # ruff-native
]
ignore = [
    "TRY004",            # normalize() raises ValueError on bad input shape — intentional
]

[tool.ruff.lint.per-file-ignores]
"tools/import_osm.py" = ["E501"]
"vietgeo/osm.py" = ["E501"]
"vietgeo/server.py" = ["E501", "SIM105"]
"vietgeo/db.py" = ["E501", "TRY004"]

[tool.ruff.format]
quote-style = "double"
