name: CI
# No untrusted input in run: commands; all actions use pinned versions. Health/API checks target localhost only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Compile check
        run: python -m compileall -q vietgeo tools tests

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unittest
        run: python -m unittest discover -s tests -v
      - name: Node check
        run: |
          node --version
          node --check web/app.js

  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t vietgeo-nova:test .
      - name: Run container
        run: docker run -d --name vietgeo-smoke -p 127.0.0.1:8765:8765 vietgeo-nova:test
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/api/health || true)
            if [ "$code" = "200" ]; then
              echo "Health check passed (HTTP 200)"
              curl -fsS http://127.0.0.1:8765/api/health
              break
            fi
            echo "Attempt $i: status $code, retrying..."
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "Health check FAILED"
            exit 1
          fi
      - name: API probe
        run: |
          curl -fsS http://127.0.0.1:8765/api/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['ok']==True, d; print('api OK')"
          curl -fsS http://127.0.0.1:8765/api/provinces | python -c "import sys,json; d=json.load(sys.stdin); assert len(d['items'])==34, d; print('provinces OK')"
      - name: Cleanup
        if: always()
        run: docker rm -f vietgeo-smoke

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          packs: security-extended, security-and-quality
      - name: Build databases
        uses: github/codeql-action/autobuild@v4
      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "security-extended"

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start server
        run: |
          python -m vietgeo.server --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/api/health || true)
            if [ "$code" = "200" ]; then break; fi
            echo "Waiting: $code"; sleep 1
          done
      - name: API assertions
        run: |
          curl -fsS http://127.0.0.1:8765/api/health
          curl -fsS http://127.0.0.1:8765/api/provinces | python -c "import sys,json; assert len(json.load(sys.stdin)['items'])==34; print('e2e OK')"
      - name: Static HTML check
        run: |
          curl -fsS http://127.0.0.1:8765/ | python -c "import sys; h=sys.stdin.read(); assert 'VietGeo Nova' in h; print('static OK')"
